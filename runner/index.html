<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Script Runner</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5b6577;
    --border: #d5dae3; --accent: #1f6feb; --accent-text: #ffffff;
    --stop: #c62828; --ok: #2e7d32; --term-bg: #10141b; --term-text: #e6edf3;
    --echo: #7ee787; --notice: #f2cc60; --drop: #eef4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #171b23; --text: #e6edf3; --muted: #9aa5b5;
      --border: #2c3442; --accent: #4c8dff; --accent-text: #0b0e13;
      --stop: #ef5350; --ok: #66bb6a; --term-bg: #0a0d12; --term-text: #e6edf3;
      --echo: #7ee787; --notice: #f2cc60; --drop: #1a2333;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .status { font-weight: 600; color: var(--muted); }
  .status.running { color: var(--ok); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label { color: var(--muted); }
  input[type=text], input[type=password] {
    font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); }
  button { font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 8px;
           border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.stop { background: var(--stop); color: #fff; border-color: var(--stop); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #drop { border: 2px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center;
          color: var(--muted); cursor: pointer; }
  #drop.over { border-color: var(--accent); background: var(--drop); color: var(--text); }
  #files { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
  #files li { display: flex; align-items: center; gap: 8px; }
  #files .remove { padding: 2px 8px; font-weight: 400; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .layout.has-media { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  @media (max-width: 760px) { .layout.has-media { grid-template-columns: minmax(0, 1fr); } }
  #output { background: var(--term-bg); color: var(--term-text); border-radius: 10px; margin: 0;
            padding: 12px; min-height: 320px; max-height: 60vh; overflow: auto;
            font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  #output .echo { color: var(--echo); }
  #output .notice { color: var(--notice); }
  #inputForm { display: flex; gap: 8px; margin-top: 10px; }
  #inputForm input { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #media { display: grid; gap: 10px; align-content: start; }
  #media figure { margin: 0; }
  #media img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #fff; }
  #media figcaption { color: var(--muted); font-size: 13px; }
  #media .card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  #media .card strong { display: block; word-break: break-all; }
  #media .drawing svg { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border);
                        background: #fff; }  /* a transparent drawing is shown on white, as a browser shows the file */
  #media pre { margin: 6px 0 0; max-height: 240px; overflow: auto; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; }
  .hint { color: var(--muted); font-size: 13px; }
  .error { color: var(--stop); font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pi Script Runner</h1>
    <span id="status" class="status" role="status">Connecting…</span>
  </header>

  <section class="panel">
    <div class="row">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" size="8">
      <label for="timeLimit">Time limit (s)</label>
      <input id="timeLimit" type="number" min="0" step="1" size="6" placeholder="default"
             title="Seconds before a run is stopped automatically; 0 means no limit; blank uses the Pi's default">
      <label><input id="speakSay" type="checkbox" checked> Speak say() messages</label>
      <label><input id="speakAll" type="checkbox"> Speak all output</label>
    </div>
  </section>

  <section class="panel">
    <div id="drop" tabindex="0" role="button" aria-label="Choose files to upload">
      Drop your .py file here (plus any sound or image files it uses), or click to choose files.
    </div>
    <input id="picker" type="file" multiple hidden>
    <ul id="files"></ul>
    <div class="row" style="margin-top:12px">
      <button id="runBtn" class="primary" disabled>Run</button>
      <button id="stopBtn" class="stop" disabled>Stop (Esc)</button>
      <button id="clearBtn">Clear output</button>
      <span id="message" class="error" role="alert"></span>
    </div>
  </section>

  <div id="layout" class="layout">
    <section class="panel">
      <pre id="output" aria-label="Program output"></pre>
      <form id="inputForm" autocomplete="off">
        <input id="inputText" type="text" placeholder="Type input for your program, then press Enter" disabled>
        <button id="sendBtn" disabled>Send</button>
      </form>
      <p class="hint">Stop sends Ctrl+C to your program, so its <code>finally:</code> block runs.</p>
    </section>
    <section id="media" class="panel" hidden aria-label="Images from your program"></section>
  </div>
</main>

<script>
(function () {
  "use strict";
  var TAG = "@@runner ";
  var MAX_OUTPUT_CHARS = 300000;

  var el = function (id) { return document.getElementById(id); };
  var statusEl = el("status"), outputEl = el("output"), messageEl = el("message");
  var runBtn = el("runBtn"), stopBtn = el("stopBtn"), inputText = el("inputText"), sendBtn = el("sendBtn");
  var pinEl = el("pin"), mediaEl = el("media"), layoutEl = el("layout");

  var files = {};            // name -> File
  var mainName = "";
  var runId = "", since = 0, source = null, running = false;
  var pending = "", liveNode = null, outputChars = 0;

  // ---------- per-viewer conveniences ----------
  function load(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
  function save(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  pinEl.value = load("script_runner_pin");
  pinEl.addEventListener("change", function () { save("script_runner_pin", pinEl.value); });
  var timeLimitEl = el("timeLimit");
  timeLimitEl.value = load("script_runner_time_limit");
  timeLimitEl.addEventListener("change", function () { save("script_runner_time_limit", timeLimitEl.value); });

  function pin() { return pinEl.value.trim(); }
  function showMessage(text) { messageEl.textContent = text || ""; }

  // ---------- file selection ----------
  var drop = el("drop"), picker = el("picker");
  drop.addEventListener("click", function () { picker.click(); });
  drop.addEventListener("keydown", function (e) { if ("Enter" === e.key || " " === e.key) { e.preventDefault(); picker.click(); } });
  picker.addEventListener("change", function () { addFiles(picker.files); picker.value = ""; });
  ["dragenter", "dragover"].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) { addFiles(e.dataTransfer.files); });
  // also accept drops anywhere on the page
  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) { e.preventDefault(); if (e.dataTransfer.files.length) { addFiles(e.dataTransfer.files); } });

  function addFiles(list) {
    for (var i = 0; i < list.length; ++i) {
      files[list[i].name] = list[i];
      if (/\.py$/i.test(list[i].name)) { mainName = list[i].name; }
    }
    renderFiles();
  }

  function renderFiles() {
    var ul = el("files");
    ul.textContent = "";
    var names = Object.keys(files).sort();
    if (mainName && !files[mainName]) { mainName = ""; }
    names.forEach(function (name) {
      var li = document.createElement("li");
      if (/\.py$/i.test(name)) {
        var radio = document.createElement("input");
        radio.type = "radio"; radio.name = "main"; radio.checked = (name === mainName);
        radio.setAttribute("aria-label", "Run " + name);
        radio.addEventListener("change", function () { mainName = name; renderFiles(); });
        li.appendChild(radio);
      } else {
        var spacer = document.createElement("span"); spacer.style.width = "13px"; li.appendChild(spacer);
      }
      var label = document.createElement("span");
      label.textContent = name + (name === mainName ? "  (runs)" : "");
      li.appendChild(label);
      var remove = document.createElement("button");
      remove.className = "remove"; remove.type = "button"; remove.textContent = "Remove";
      remove.addEventListener("click", function () { delete files[name]; renderFiles(); });
      li.appendChild(remove);
      ul.appendChild(li);
    });
    updateButtons();
  }

  function updateButtons() {
    runBtn.disabled = running || !mainName;
    stopBtn.disabled = !running;
    inputText.disabled = !running;
    sendBtn.disabled = !running;
  }

  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result).split(",")[1] || ""); };
      reader.onerror = function () { reject(reader.error); };
      reader.readAsDataURL(file);
    });
  }

  // ---------- server calls ----------
  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-PIN": pin() },
      body: JSON.stringify(body || {})
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok) { throw new Error(data.error || ("Request failed (" + response.status + ")")); }
        return data;
      });
    });
  }

  runBtn.addEventListener("click", function () {
    showMessage("");
    // a click lets the browser play speech and sound later in this run
    try { window.speechSynthesis.cancel(); } catch (e) {}
    var names = Object.keys(files);
    Promise.all(names.map(function (n) { return readBase64(files[n]); }))
      .then(function (datas) {
        var payload = names.map(function (n, i) { return { name: n, data: datas[i] }; });
        var body = { files: payload, main: mainName };
        var limit = timeLimitEl.value.trim();
        if ("" !== limit) { body.max_seconds = parseInt(limit, 10); }
        return post("/api/run", body);
      })
      .then(function (data) {
        resetOutput();
        clearMedia();
        runId = data.run; since = 0;
        running = true; updateButtons();
        connect();
        inputText.focus();
      })
      .catch(function (err) { showMessage(err.message); });
  });

  stopBtn.addEventListener("click", stopRun);
  document.addEventListener("keydown", function (e) { if ("Escape" === e.key && running) { stopRun(); } });
  function stopRun() {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    post("/api/stop").catch(function (err) { showMessage(err.message); });
  }

  el("inputForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = inputText.value;
    inputText.value = "";
    post("/api/input", { text: text }).catch(function (err) { showMessage(err.message); });
  });

  el("clearBtn").addEventListener("click", function () { resetOutput(); clearMedia(); });

  // ---------- event stream ----------
  function connect() {
    if (source) { source.close(); source = null; }
    var url = "/api/events?pin=" + encodeURIComponent(pin()) +
              "&run=" + encodeURIComponent(runId) + "&since=" + since;
    source = new EventSource(url);
    source.onmessage = function (msg) { handleEvent(JSON.parse(msg.data)); };
    source.onerror = function () {
      if (source) { source.close(); source = null; }
      if (running) { setTimeout(connect, 1000); }     // reconnect, resuming where we left off
    };
  }

  function handleEvent(ev) {
    if ("hello" === ev.type) {
      if (ev.run !== runId) { runId = ev.run; since = 0; resetOutput(); }
      return;
    }
    if (ev.seq < since) { return; }                    // already seen (after a reconnect)
    since = ev.seq + 1;
    if ("out" === ev.type) {
      addOutput(ev.text);
    } else if ("echo" === ev.type) {
      // keep an input() prompt and the typed answer on the same line
      if (pending && pending.indexOf(TAG) < 0) { commit(pending); pending = ""; updateLive(); }
      else { flushPending(); }
      commit(ev.text, "echo");
    } else if ("notice" === ev.type) {
      flushPending(); commit(ev.text + "\n", "notice");
    } else if ("status" === ev.type && "running" === ev.state) {
      running = true; updateButtons();
      setStatus("Running " + ev.file, true);
    } else if ("status" === ev.type && "exited" === ev.state) {
      flushPending();
      running = false; updateButtons();
      if (source) { source.close(); source = null; }
      var text = ev.text ? ev.text :
        ("stopped" === ev.reason ? "Stopped" : "Finished") +
        (null === ev.code || undefined === ev.code ? "" : " (exit code " + ev.code + ")");
      commit("\n" + text + "\n", "notice");
      setStatus("Ready", false);
    }
  }

  // ---------- output with say/play/show tags ----------
  function addOutput(text) {
    pending += text;
    var lines = pending.split("\n");
    pending = lines.pop();
    lines.forEach(handleLine);
    updateLive();
  }

  function handleLine(line) {
    var at = line.indexOf(TAG);
    if (at < 0) {
      commit(line + "\n");
      if (el("speakAll").checked && line.trim()) { speak(line); }
      return;
    }
    if (0 < at) { commit(line.slice(0, at) + "\n"); }
    var rest = line.slice(at + TAG.length);
    var space = rest.indexOf(" ");
    var kind = space < 0 ? rest : rest.slice(0, space);
    var value = space < 0 ? "" : rest.slice(space + 1);
    if ("say" === kind) {
      commit("🔊 " + value + "\n", "notice");
      if (el("speakSay").checked || el("speakAll").checked) { speak(value); }
    } else if ("play" === kind) {
      commit("♪ " + value + "\n", "notice");
      var audio = new Audio(mediaUrl(value));
      audio.play().catch(function () { commit("Could not play " + value + "\n", "notice"); });
    } else if ("show" === kind) {
      commit((isImageName(value) ? "🖼 " : "📄 ") + value + "\n", "notice");
      showFile(value);
    } else if ("call" === kind) {
      // remote_execute(): local functions need the app, which runs Python; answer at once so the script does not wait.
      var call = {};
      try { call = JSON.parse(value); } catch (e) {}
      commit("💻 " + (call.function || "") + "\n", "notice");
      var reply = { id: call.id, ok: false,
                    error: "remote_execute() needs the Script Runner app; the browser page cannot run local functions." };
      post("/api/input", { text: TAG + "reply " + JSON.stringify(reply), echo: false }).catch(function () {});
    } else if ("plot" === kind) {
      // plot(): the app draws a graph; the page shows the numbers as text.
      var values = {};
      try { values = JSON.parse(value); } catch (e) {}
      commit("📈 " + Object.keys(values).map(function (k) { return k + " " + values[k]; }).join(", ") + "\n", "notice");
    } else if ("draw" === kind) {
      // draw: the picture is shown beside the output, as the app shows it.
      var command = null;
      try { command = JSON.parse(value); } catch (e) {}
      if (!applyDraw(command)) { commit(line + "\n"); }
    } else if ("reply" === kind || "reply-file" === kind) {
      // an answer sent to the script: not shown
    } else {
      commit(line + "\n");
    }
  }

  // The unfinished last line (for example an input() prompt) is shown live,
  // except the part that may turn out to be a tag.
  function updateLive() {
    var visible = pending;
    var at = pending.indexOf("@");
    if (0 <= at) {
      var tail = pending.slice(at);
      if (0 === TAG.indexOf(tail) || 0 === tail.indexOf(TAG)) { visible = pending.slice(0, at); }
    }
    if (!liveNode) { liveNode = document.createElement("span"); outputEl.appendChild(liveNode); }
    liveNode.textContent = visible;
    scrollDown();
  }

  function flushPending() {
    if (pending) { var p = pending; pending = ""; handleLine(p); }
    if (liveNode) { liveNode.textContent = ""; }
  }

  function commit(text, cls) {
    var node = document.createElement("span");
    if (cls) { node.className = cls; }
    node.textContent = text;
    if (liveNode && liveNode.parentNode === outputEl) { outputEl.insertBefore(node, liveNode); }
    else { outputEl.appendChild(node); }
    outputChars += text.length;
    while (MAX_OUTPUT_CHARS < outputChars && outputEl.firstChild && outputEl.firstChild !== liveNode) {
      outputChars -= outputEl.firstChild.textContent.length;
      outputEl.removeChild(outputEl.firstChild);
    }
    scrollDown();
  }

  function scrollDown() { outputEl.scrollTop = outputEl.scrollHeight; }

  function resetOutput() {
    outputEl.textContent = ""; liveNode = null; pending = ""; outputChars = 0;
  }

  // ---------- speech, sound, images ----------
  function speak(text) {
    try { window.speechSynthesis.speak(new SpeechSynthesisUtterance(text)); } catch (e) {}
  }

  function mediaUrl(name) {
    return "/api/media?pin=" + encodeURIComponent(pin()) + "&name=" + encodeURIComponent(name) + "&t=" + Date.now();
  }

  var IMAGE_EXTENSIONS = [".png", ".jpg", ".jpeg", ".gif", ".bmp", ".webp", ".svg"];
  var TEXT_EXTENSIONS = [".csv", ".tsv", ".txt", ".log", ".json", ".py", ".md", ".xml", ".yaml", ".yml", ".ini", ".cfg"];
  var PREVIEW_LINES = 20, PREVIEW_CHARS = 2000;
  var objectUrls = [];

  function extensionOf(name) {
    var dot = name.lastIndexOf(".");
    return dot < 0 ? "" : name.slice(dot).toLowerCase();
  }
  function isImageName(name) { return -1 !== IMAGE_EXTENSIONS.indexOf(extensionOf(name)); }
  function baseName(name) { return name.split("/").pop(); }
  function describeSize(bytes) {
    if (bytes < 1024) { return bytes + " bytes"; }
    if (bytes < 1024 * 1024) { return (bytes / 1024).toFixed(1).replace(/\.0$/, "") + " KB"; }
    return (bytes / (1024 * 1024)).toFixed(1).replace(/\.0$/, "") + " MB";
  }
  function previewOf(text) {
    var lines = text.replace(/\r\n/g, "\n").replace(/\n$/, "").split("\n");
    var preview = lines.slice(0, PREVIEW_LINES).join("\n");
    var more = PREVIEW_LINES < lines.length;
    if (PREVIEW_CHARS < preview.length) { preview = preview.slice(0, PREVIEW_CHARS); more = true; }
    return more ? preview + "\n…" : preview;
  }

  // The file is downloaded right away (the Pi erases it at the next run), shown newest first, and kept in the page
  // with a Save link: images as pictures, text files with their first lines, other files with their name and size.
  function showFile(name) {
    var fig = document.createElement("figure");
    var cap = document.createElement("figcaption");
    cap.textContent = name + " (loading…)";
    fig.appendChild(cap);
    // newest first, below the drawing (if there is one), which stays at the top
    mediaEl.insertBefore(fig, drawingFig ? drawingFig.nextSibling : mediaEl.firstChild);
    mediaEl.hidden = false; layoutEl.classList.add("has-media");

    fetch(mediaUrl(name)).then(function (response) {
      if (!response.ok) { throw new Error("not found"); }
      return response.blob();
    }).then(function (blob) {
      var url = URL.createObjectURL(blob);
      objectUrls.push(url);
      var save = document.createElement("a");
      save.href = url; save.download = baseName(name); save.textContent = "Save";
      cap.textContent = name + " · " + describeSize(blob.size) + " · ";
      cap.appendChild(save);
      if (isImageName(name)) {
        var img = document.createElement("img");
        img.alt = name; img.src = url;
        img.onerror = function () { fig.removeChild(img); cap.insertBefore(document.createTextNode("could not be displayed · "), save); };
        fig.insertBefore(img, cap);
        return;
      }
      fig.className = "card";
      var title = document.createElement("strong");
      title.textContent = "📄 " + name;
      fig.insertBefore(title, cap);
      if (-1 === TEXT_EXTENSIONS.indexOf(extensionOf(name))) {
        cap.insertBefore(document.createTextNode("no preview · "), save);
        return;
      }
      blob.text().then(function (text) {
        if (-1 !== text.indexOf("\u0000")) {
          cap.insertBefore(document.createTextNode("no preview · "), save);
          return;
        }
        var pre = document.createElement("pre");
        pre.textContent = previewOf(text);
        fig.appendChild(pre);
      });
    }).catch(function () {
      cap.textContent = "Could not load " + name;
    });
  }

  function clearMedia() {
    objectUrls.forEach(function (url) { URL.revokeObjectURL(url); });
    objectUrls = [];
    mediaEl.textContent = ""; mediaEl.hidden = true; layoutEl.classList.remove("has-media");
    drawing = { shapes: [], bounds: null, grid: null, background: "none" }; drawingFig = null;
  }

  // ---------- draw: the same picture as runner_io's save_svg() and the app ----------
  var MOST_SHAPES = 20000, MOST_POINTS = 5000, SVG_BOX = 760, MARGIN = 20, MOST_GRID_LINES = 200;
  var SHAPE_OPS = ["line", "polyline", "polygon", "rect", "circle", "text", "marker"];
  var MARKER_SHAPES = ["circle", "square", "triangle", "diamond", "x", "plus"];
  var drawing = { shapes: [], bounds: null, grid: null, background: "none" }, drawingFig = null, drawingQueued = false;

  function finite(v) { return "number" === typeof v && isFinite(v); }
  function clamp(v, low, high) { return Math.max(low, Math.min(high, v)); }
  function checkColor(text, fallback) {
    var c = String(null == text ? "" : text).trim().toLowerCase();
    return /^(#[0-9a-f]{3}|#[0-9a-f]{6}|[a-z]{1,32})$/.test(c) ? c : fallback;
  }
  function fmt(v, places) {
    var scale = Math.pow(10, places || 2), scaled = v * scale, whole = Math.round(scaled);
    if (0.5 === Math.abs(scaled % 1)) { whole = 2 * Math.round(scaled / 2); }     // ties to even, as Python rounds
    var sign = whole < 0 ? "-" : ""; whole = Math.abs(whole);
    var text = sign + Math.floor(whole / scale), fraction = whole % scale;
    if (fraction) { text += ("." + String(fraction).padStart(places || 2, "0")).replace(/0+$/, ""); }
    return text;
  }
  function esc(text) {
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Applies a draw message; false when it is not a valid one (it is then shown as text).
  function applyDraw(c) {
    if (!c || "object" !== typeof c || "string" !== typeof c.op) { return false; }
    if ("canvas" === c.op) {
      var b = c.bounds, g = c.grid;
      if (null != b && !(Array.isArray(b) && 4 === b.length && b.every(finite) && b[0] < b[1] && b[2] < b[3])) { return false; }
      if (null != g && !(finite(g) && 0 < g)) { return false; }
      drawing.bounds = null == b ? null : b.slice(); drawing.grid = null == g ? null : g;
      drawing.background = checkColor(c.background, "none");
    } else if ("clear" === c.op) {
      drawing.shapes = [];
    } else if ("remove" === c.op) {
      drawing.shapes = drawing.shapes.filter(function (s) { return s.name !== String(c.name); });
    } else if (-1 !== SHAPE_OPS.indexOf(c.op)) {
      var shape = readShape(c);
      if (!shape) { return false; }
      if (null != shape.name) { drawing.shapes = drawing.shapes.filter(function (s) { return s.name !== shape.name; }); }
      drawing.shapes.push(shape);
      if (MOST_SHAPES < drawing.shapes.length) { drawing.shapes.splice(0, drawing.shapes.length - MOST_SHAPES); }
    } else {
      return false;
    }
    queueDrawing();
    return true;
  }

  function readShape(c) {
    var points = Array.isArray(c.points) ? c.points : [];
    var fewest = { line: 2, polyline: 2, polygon: 3, marker: 1 }[c.op] || 0;
    if (points.length < fewest || ("line" === c.op && 2 !== points.length) || MOST_POINTS < points.length ||
        !points.every(function (p) { return Array.isArray(p) && 2 === p.length && finite(p[0]) && finite(p[1]); })) { return null; }
    function num(name, fallback) { return undefined === c[name] ? fallback : c[name]; }
    var s = { op: c.op, points: points, x: num("x", 0), y: num("y", 0), w: num("w", 0), h: num("h", 0), r: num("r", 0),
              text: String(num("text", "")), color: checkColor(c.color, "black"), fill: checkColor(c.fill, "none"),
              width: num("width", 2), size: num("size", "text" === c.op ? 14 : 10), shape: String(num("shape", "circle")),
              name: null == c.name ? null : String(c.name) };
    if (![s.x, s.y, s.w, s.h, s.r, s.width, s.size].every(finite) || s.w < 0 || s.h < 0 || s.r < 0) { return null; }
    if ("marker" === c.op && -1 === MARKER_SHAPES.indexOf(s.shape)) { return null; }
    s.width = clamp(s.width, 0.5, 50);
    s.size = "text" === c.op ? clamp(s.size, 4, 96) : clamp(s.size, 2, 200);
    return s;
  }

  function drawingView() {
    if (drawing.bounds) { return drawing.bounds; }
    var xs = [], ys = [];
    drawing.shapes.forEach(function (s) {
      if (s.points.length) { s.points.forEach(function (p) { xs.push(p[0]); ys.push(p[1]); }); }
      else if ("rect" === s.op) { xs.push(s.x, s.x + s.w); ys.push(s.y, s.y + s.h); }
      else if ("circle" === s.op) { xs.push(s.x - s.r, s.x + s.r); ys.push(s.y - s.r, s.y + s.r); }
      else { xs.push(s.x); ys.push(s.y); }
    });
    if (!xs.length) { xs = [0, 1]; ys = [0, 1]; }
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
    var ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys);
    var pad = 0.05 * Math.max(xmax - xmin, ymax - ymin) || 1;
    return [xmin - pad, xmax + pad, ymin - pad, ymax + pad];
  }

  function drawingSvg() {
    var v = drawingView(), spanX = v[1] - v[0], spanY = v[3] - v[2];
    var k = Math.min(SVG_BOX / spanX, SVG_BOX / spanY);
    var width = spanX * k + 2 * MARGIN, height = spanY * k + 2 * MARGIN;
    var left0 = (width - spanX * k) / 2, top0 = (height - spanY * k) / 2;
    function X(x) { return left0 + (x - v[0]) * k; }
    function Y(y) { return top0 + (v[3] - y) * k; }
    var out = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + fmt(width) + '" height="' + fmt(height) +
               '" viewBox="0 0 ' + fmt(width) + " " + fmt(height) + '">'];
    if ("none" !== drawing.background) {
      out.push('<rect width="' + fmt(width) + '" height="' + fmt(height) + '" fill="' + drawing.background + '"/>');
    }
    var g = drawing.grid;
    if (null != g) {
      var fx = Math.ceil(v[0] / g - 1e-9), lx = Math.floor(v[1] / g + 1e-9);
      var fy = Math.ceil(v[2] / g - 1e-9), ly = Math.floor(v[3] / g + 1e-9);
      if (lx - fx + 1 <= MOST_GRID_LINES && ly - fy + 1 <= MOST_GRID_LINES) {
        var left = X(v[0]), right = X(v[1]), top = Y(v[3]), bottom = Y(v[2]), xs = [], ys = [], i;
        for (i = fx; i <= lx; ++i) { xs.push(i * g); }
        for (i = fy; i <= ly; ++i) { ys.push(i * g); }
        out.push('<g stroke="#DDDDDD" stroke-width="1">');
        xs.forEach(function (x) { out.push('<line x1="' + fmt(X(x)) + '" y1="' + fmt(top) + '" x2="' + fmt(X(x)) + '" y2="' + fmt(bottom) + '"/>'); });
        ys.forEach(function (y) { out.push('<line x1="' + fmt(left) + '" y1="' + fmt(Y(y)) + '" x2="' + fmt(right) + '" y2="' + fmt(Y(y)) + '"/>'); });
        out.push("</g>");
        out.push('<rect x="' + fmt(left) + '" y="' + fmt(top) + '" width="' + fmt(right - left) + '" height="' + fmt(bottom - top) +
                 '" fill="none" stroke="#BBBBBB" stroke-width="1"/>');
        out.push('<g font-family="sans-serif" font-size="10" fill="#888888">');
        xs.forEach(function (x) { out.push('<text x="' + fmt(X(x) + 2) + '" y="' + fmt(bottom - 3) + '">' + fmt(x, 3) + "</text>"); });
        ys.forEach(function (y) { out.push('<text x="' + fmt(left + 2) + '" y="' + fmt(Y(y) - 2) + '">' + fmt(y, 3) + "</text>"); });
        out.push("</g>");
      }
    }
    drawing.shapes.forEach(function (s) {
      var c = s.color;
      if ("marker" === s.op) {
        s.points.forEach(function (p) { out.push(markerSvg(s.shape, X(p[0]), Y(p[1]), s.size, c)); });
        return;
      }
      if ("text" === s.op) {
        out.push('<text x="' + fmt(X(s.x)) + '" y="' + fmt(Y(s.y)) + '" font-family="sans-serif" font-size="' + fmt(s.size) +
                 '" fill="' + c + '">' + esc(s.text) + "</text>");
        return;
      }
      var stroke = 'stroke="' + c + '" stroke-width="' + fmt(s.width) + '"';
      if ("line" === s.op) {
        out.push('<line x1="' + fmt(X(s.points[0][0])) + '" y1="' + fmt(Y(s.points[0][1])) + '" x2="' + fmt(X(s.points[1][0])) +
                 '" y2="' + fmt(Y(s.points[1][1])) + '" ' + stroke + ' stroke-linecap="round"/>');
      } else if ("polyline" === s.op || "polygon" === s.op) {
        var pts = s.points.map(function (p) { return fmt(X(p[0])) + "," + fmt(Y(p[1])); }).join(" ");
        out.push("<" + s.op + ' points="' + pts + '" fill="' + ("polyline" === s.op ? "none" : s.fill) + '" ' + stroke +
                 ' stroke-linecap="round" stroke-linejoin="round"/>');
      } else if ("rect" === s.op) {
        out.push('<rect x="' + fmt(X(s.x)) + '" y="' + fmt(Y(s.y + s.h)) + '" width="' + fmt(s.w * k) + '" height="' + fmt(s.h * k) +
                 '" fill="' + s.fill + '" ' + stroke + "/>");
      } else {
        out.push('<circle cx="' + fmt(X(s.x)) + '" cy="' + fmt(Y(s.y)) + '" r="' + fmt(s.r * k) + '" fill="' + s.fill + '" ' + stroke + "/>");
      }
    });
    out.push("</svg>");
    return out.join("\n") + "\n";
  }

  function markerSvg(shape, x, y, size, c) {
    var h = size / 2;
    if ("circle" === shape) { return '<circle cx="' + fmt(x) + '" cy="' + fmt(y) + '" r="' + fmt(h) + '" fill="' + c + '"/>'; }
    if ("square" === shape) {
      return '<rect x="' + fmt(x - h) + '" y="' + fmt(y - h) + '" width="' + fmt(size) + '" height="' + fmt(size) + '" fill="' + c + '"/>';
    }
    if ("x" === shape || "plus" === shape) {
      var d = "x" === shape
        ? "M" + fmt(x - h) + " " + fmt(y - h) + "L" + fmt(x + h) + " " + fmt(y + h) + "M" + fmt(x - h) + " " + fmt(y + h) + "L" + fmt(x + h) + " " + fmt(y - h)
        : "M" + fmt(x - h) + " " + fmt(y) + "L" + fmt(x + h) + " " + fmt(y) + "M" + fmt(x) + " " + fmt(y - h) + "L" + fmt(x) + " " + fmt(y + h);
      return '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="2" stroke-linecap="round"/>';
    }
    var corners = "triangle" === shape ? [[x, y - h], [x + h, y + h], [x - h, y + h]]
                                       : [[x, y - h], [x + h, y], [x, y + h], [x - h, y]];
    return '<polygon points="' + corners.map(function (p) { return fmt(p[0]) + "," + fmt(p[1]); }).join(" ") + '" fill="' + c + '"/>';
  }

  // Redraws at most once per frame, however many messages arrive in it.
  function queueDrawing() {
    if (drawingQueued) { return; }
    drawingQueued = true;
    (window.requestAnimationFrame || setTimeout)(function () { drawingQueued = false; renderDrawing(); });
  }

  function renderDrawing() {
    if (!drawingFig) {
      drawingFig = document.createElement("figure");
      drawingFig.className = "drawing";
      var picture = document.createElement("div");
      var cap = document.createElement("figcaption");
      var save = document.createElement("a");
      save.href = "#"; save.download = "drawing.svg"; save.textContent = "Save";
      save.addEventListener("click", function () {
        var url = URL.createObjectURL(new Blob([drawingSvg()], { type: "image/svg+xml" }));
        objectUrls.push(url);
        save.href = url;
      });
      cap.appendChild(document.createTextNode("Drawing · "));
      cap.appendChild(save);
      drawingFig.appendChild(picture);
      drawingFig.appendChild(cap);
      mediaEl.insertBefore(drawingFig, mediaEl.firstChild);
      mediaEl.hidden = false; layoutEl.classList.add("has-media");
    }
    drawingFig.firstChild.innerHTML = drawingSvg();       // built from checked colors, numbers, and escaped text
  }

  // ---------- status ----------
  function setStatus(text, isRunning) {
    statusEl.textContent = text;
    statusEl.classList.toggle("running", !!isRunning);
  }

  fetch("/api/status").then(function (r) { return r.json(); }).then(function (s) {
    if (s.busy) {
      setStatus("Busy: another script is running", true);
      if (pin()) { running = true; updateButtons(); connect(); }
    } else {
      setStatus("Ready", false);
    }
  }).catch(function () { setStatus("Cannot reach the Pi", false); });

  renderFiles();
})();
</script>
</body>
